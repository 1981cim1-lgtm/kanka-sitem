
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanka'nın Sitesi</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      text-align: center;
    }

    header {
      padding: 25px;
      background: #151b30;
      color: #a78bfa;
      font-size: 25px;
      font-weight: bold;
    }

    main {
      padding: 100px 20px;
    }

    h1 {
      font-size: 45px;
      color: #a78bfa;
    }

    p {
      color: #cbd5e1;
      line-height: 1.8;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 25px;
      background: #7c3aed;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }

    a:hover {
      background: #6d28d9;
    }

    footer {
      padding: 25px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <header>KANKA.DEV 🚀</header>

  <main>
    <h1>Selam Dünya!</h1>
    <p>Bu benim ilk web sitem!</p>
    <p>Kendi internet sitemi GitHub ile yapıyorum.</p>
    <a href="https://github.com/" target="_blank">
      GitHub'ı Keşfet
    </a>
  </main>

  <footer>© 2026 Kanka.dev</footer>

</body>
</html>
